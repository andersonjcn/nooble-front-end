<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>General</title>
</head>

<body>
    <!-- container -->

    <div class="container-settings">
        <!-- sidebar -->

        <div class="sidebar-settings">
            <ul class="ul-navbar">
                <li>
                    <a href="https://www.google.com">
                        <div class="li-navbar group">
                            <i class="fa-solid fa-house-user fa-xl text-white"></i>
                            <p class="p-navbar">Dashboard</p>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="https://www.google.com">
                        <div class="li-navbar group">
                            <i class="fa-solid fa-envelope fa-xl text-white"></i>
                            <p class="p-navbar">Mensagens</p>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="https://www.google.com">
                        <div class="li-navbar group">
                            <i class="fa-solid fa-gears fa-xl text-white"></i>
                            <p class="p-navbar">Configurações</p>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="https://www.google.com">
                        <div class="li-navbar group">
                            <i class="fa-solid fa-right-from-bracket fa-xl text-white"></i>
                            <p class="p-navbar">Sair</p>
                        </div>
                    </a>
                </li>
            </ul>
        </div>

        <div class="general">

            <!-- header right side -->

            <header class="header-wrapper">
                <div class="header-user">
                    <div class="user-photo"></div>
                    <div class="user-name">Nome Usuário</div>
                </div>
            </header>
            <h1 class="h1-user-area">Área do Usuário</h1>

            <!-- grid cards -->

            <!-- card 1 -->
            <div class="user-infos-grid">
                <div class="grid-items">
                    <p class="grid-title">Próximas Reuniões</p>
                    <p class="grid-subtitle">Reunião Semanal</p>
                    <p class="">15 de outubro de 2025</p>
                    <p class="">12:00 - 13:00</p>
                    <div class="div-btn">
                        <button class="btn-blue">Entrar
                        </button>
                    </div>
                </div>

                <!-- card 2 -->

                <div class="grid-items">
                    <p class="grid-title">Perfil</p>
                    <p class="grid-subtitle">Nome: Anderson Ferreira</p>
                    <p class="">Email: andersonjcnmf6@gmail.com </p>
                    <div class="div-btn">
                        <button class="btn-white">Atualizar
                        </button>
                    </div>
                </div>

                <!-- card 3 -->

                <div class="grid-items">
                    <p class="grid-title">Notificações</p>
                    <div class="div-btn">
                        <button class="btn-white">Ver Mensagens
                        </button>
                    </div>
                </div>

                <!-- card 4 -->

                <div class="grid-items">
                    <p class="grid-title">Configurações</p>
                    <p class="">Preferencias de Notificação</p>
                    <p class="">Idioma</p>
                    <div class="div-btn">
                        <button class="btn-white">Editar
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
